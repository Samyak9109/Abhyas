<!-- Place as the FIRST child of <body>, before your app root, so it paints immediately. -->
<div id="abhyas-preloader" role="status" aria-live="polite" aria-label="Loading Abhyas">
  <div class="ap-stage">
    <svg class="ap-mark" viewBox="0 0 70 70" shape-rendering="crispEdges" aria-hidden="true">
      <rect class="ap-px" style="--i:0"  x="20" y="0"  width="30" height="10"/>
      <rect class="ap-px" style="--i:1"  x="10" y="10" width="20" height="10"/>
      <rect class="ap-px" style="--i:2"  x="40" y="10" width="20" height="10"/>
      <rect class="ap-px" style="--i:3"  x="0"  y="20" width="20" height="10"/>
      <rect class="ap-px" style="--i:4"  x="50" y="20" width="20" height="10"/>
      <rect class="ap-px" style="--i:5"  x="0"  y="30" width="20" height="10"/>
      <rect class="ap-px" style="--i:6"  x="50" y="30" width="20" height="10"/>
      <rect class="ap-bar" x="0" y="40" width="70" height="10"/>
      <rect class="ap-px" style="--i:8"  x="0"  y="50" width="20" height="10"/>
      <rect class="ap-px" style="--i:9"  x="50" y="50" width="20" height="10"/>
      <rect class="ap-px" style="--i:10" x="0"  y="60" width="20" height="10"/>
      <rect class="ap-px" style="--i:11" x="50" y="60" width="20" height="10"/>
    </svg>
    <div class="ap-word" aria-hidden="true"><span class="ap-word-text">abhyas</span><span class="ap-cursor"></span></div>
    <div class="ap-meter" aria-hidden="true">
      <span style="--s:0"></span><span style="--s:1"></span><span style="--s:2"></span><span style="--s:3"></span>
      <span style="--s:4"></span><span style="--s:5"></span><span style="--s:6"></span><span style="--s:7"></span>
    </div>
  </div>
</div>
