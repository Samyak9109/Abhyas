<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' https://generativelanguage.googleapis.com https://api.openai.com https://api.anthropic.com https://api-inference.huggingface.co https://router.huggingface.co https://huggingface.co https://cdn-lfs.huggingface.co http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self';"
    />
    <title>Abhyas — Private AI Interview Practice</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#121110" />
    <meta property="og:image" content="/abhyas-og-1200x630.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/preloader.css" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="abhyas-preloader" data-manual role="status" aria-live="polite" aria-label="Loading Abhyas">
      <div class="ap-stage">
        <svg class="ap-mark" viewBox="0 0 70 70" shape-rendering="crispEdges" aria-hidden="true">
          <rect class="ap-px" style="--i:0"  x="20" y="0"  width="30" height="10"/>
          <rect class="ap-px" style="--i:1"  x="10" y="10" width="20" height="10"/>
          <rect class="ap-px" style="--i:2"  x="40" y="10" width="20" height="10"/>
          <rect class="ap-px" style="--i:3"  x="0"  y="20" width="20" height="10"/>
          <rect class="ap-px" style="--i:4"  x="50" y="20" width="20" height="10"/>
          <rect class="ap-px" style="--i:5"  x="0"  y="30" width="20" height="10"/>
          <rect class="ap-px" style="--i:6"  x="50" y="30" width="20" height="10"/>
          <rect class="ap-bar" x="0" y="40" width="70" height="10"/>
          <rect class="ap-px" style="--i:8"  x="0"  y="50" width="20" height="10"/>
          <rect class="ap-px" style="--i:9"  x="50" y="50" width="20" height="10"/>
          <rect class="ap-px" style="--i:10" x="0"  y="60" width="20" height="10"/>
          <rect class="ap-px" style="--i:11" x="50" y="60" width="20" height="10"/>
        </svg>
        <div class="ap-word" aria-hidden="true"><span class="ap-word-text">abhyas</span><span class="ap-cursor"></span></div>
        <div class="ap-meter" aria-hidden="true">
          <span style="--s:0"></span><span style="--s:1"></span><span style="--s:2"></span><span style="--s:3"></span>
          <span style="--s:4"></span><span style="--s:5"></span><span style="--s:6"></span><span style="--s:7"></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script src="/preloader.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
